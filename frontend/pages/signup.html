<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Swind account to start planning solar and wind energy deployments with AI-powered intelligence.">
  <title>Sign Up — Swind Platform</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <div class="auth-container">

    <!-- ═══ Left Panel (Decorative) ═══ -->
    <div class="auth-panel-left">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <img
        src="/assets/images/auth-bg.jpg"
        alt="Renewable energy landscape"
        class="auth-bg-image"
        onerror="this.style.display='none'"
      >
      <div class="auth-panel-left-content">
        <h2>Join the Energy Revolution</h2>
        <p>Create your account and start making data-driven decisions for renewable energy deployment.</p>
      </div>
    </div>

    <!-- ═══ Right Panel (Form) ═══ -->
    <div class="auth-panel-right">
      <div class="auth-form-wrapper">

        <!-- Logo -->
        <div class="auth-logo">
          <img
            src="/assets/images/logo.png"
            alt="Swind Logo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"
          >
          <span class="auth-logo-text" style="display:none;">Swind</span>
        </div>

        <h1 class="auth-heading">Create your account</h1>
        <p class="auth-subheading">Get started with Swind in just a few steps.</p>

        <!-- Error Banner -->
        <div class="error-banner" id="errorBanner" role="alert"></div>

        <form id="signupForm" novalidate>

          <!-- Full Name -->
          <div class="form-group">
            <label for="signupName">Full Name</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="signupName"
                class="form-input"
                placeholder="John Doe"
                autocomplete="name"
              >
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="signupEmail"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="email"
              >
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="signupPassword"
                class="form-input password-field"
                placeholder="Minimum 6 characters"
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="field-error" aria-live="polite"></span>
            <!-- Password Strength Indicator -->
            <div class="password-strength">
              <div class="strength-bar-track">
                <div class="strength-bar-fill"></div>
              </div>
              <div class="strength-label"></div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="signupConfirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="signupConfirmPassword"
                class="form-input password-field"
                placeholder="Re-enter your password"
                autocomplete="new-password"
              >
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-submit" id="signupBtn">
            <span>
              <div class="spinner"></div>
              Create Account
            </span>
          </button>

        </form>

        <p class="auth-bottom-link">
          Already have an account? <a href="/pages/login.html">Sign In</a>
        </p>

      </div>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
