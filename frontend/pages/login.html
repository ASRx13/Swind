<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to Swind — Solar & Wind Deployment Intelligence platform to manage your renewable energy projects.">
  <title>Login — Swind Platform</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <div class="auth-container">

    <!-- ═══ Left Panel (Decorative) ═══ -->
    <div class="auth-panel-left">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <img
        src="/assets/images/auth-bg.jpg"
        alt="Renewable energy landscape"
        class="auth-bg-image"
        onerror="this.style.display='none'"
      >
      <div class="auth-panel-left-content">
        <h2>Deploy Smarter Energy</h2>
        <p>Harness AI-driven insights to plan, deploy, and optimize solar &amp; wind installations across any terrain.</p>
      </div>
    </div>

    <!-- ═══ Right Panel (Form) ═══ -->
    <div class="auth-panel-right">
      <div class="auth-form-wrapper">

        <!-- Logo -->
        <div class="auth-logo">
          <img
            src="/assets/images/logo.png"
            alt="Swind Logo"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';"
          >
          <span class="auth-logo-text" style="display:none;">Swind</span>
        </div>

        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-subheading">Sign in to continue to your dashboard.</p>

        <!-- Error Banner -->
        <div class="error-banner" id="errorBanner" role="alert"></div>

        <form id="loginForm" novalidate>

          <!-- Email -->
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-wrapper">
              <input
                type="email"
                id="loginEmail"
                class="form-input"
                placeholder="you@example.com"
                autocomplete="email"
              >
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-wrapper">
              <input
                type="password"
                id="loginPassword"
                class="form-input password-field"
                placeholder="Enter your password"
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <span class="field-error" aria-live="polite"></span>
          </div>

          <!-- Forgot Password Link -->
          <div class="form-extras">
            <a href="/pages/forgot-password.html">Forgot Password?</a>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn-submit" id="loginBtn">
            <span>
              <div class="spinner"></div>
              Sign In
            </span>
          </button>

        </form>

        <p class="auth-bottom-link">
          Don't have an account? <a href="/pages/signup.html">Sign Up</a>
        </p>

      </div>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
